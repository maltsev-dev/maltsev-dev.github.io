base_url = "https://maltsev-dev.github.io"
title = "Maltsev · Agentic Engineering"
compile_sass = true

taxonomies = [{ name = "tags" }]

[markdown]
highlight_code = true
highlight_theme = "boron"

[extra]
accent_color = "vermilion"
logo_text = "maltsev · dev"

copyright_html = """
<div class="copyright">
    <span>© 2026 A.Maltsev</span>
    <span class="copyright-theme-sep"></span>
    <span><img src="https://visitor-badge.laobi.icu/badge?page_id=maltsev-dev.github.io&right_color=e14d2a" alt="Visitors"></span>
</div>
"""
author = "maltsev-dev"
menu_items = [
    { name = "catalogue", url = "$BASE_URL/projects/" },
    { name = "archive",   url = "$BASE_URL/archive" },
    { name = "about",     url = "$BASE_URL/about" },
]

enable_post_view_navigation = false
post_view_navigation_prompt = "Read other posts?"
use_full_font = true
favicon = "/favicon.png"
favicon_mimetype = "image/png"
page_titles = "combined"