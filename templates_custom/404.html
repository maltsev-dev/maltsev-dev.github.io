{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="error-404">
    <div class="error-404-content">
        <div class="error-404-hanko">
            <div class="hanko hanko-lg stamp-in">404</div>
        </div>

    </div>
</div>
{% endblock %}
