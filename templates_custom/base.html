<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description if page and page.description else site.title + ' — AI operational systems, agentic engineering, embedded & distributed systems' }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:type" content="{% if page %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:url" content="{{ site.base_url }}/{% if current_path %}{{ current_path }}{% endif %}">
    <meta property="og:image" content="https://github.com/maltsev-dev/favicon.png">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260918g">
    <link rel="shortcut icon" type="image/png" href="/static/favicon.png">

    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <span class="corner-mark left">¦ · ? · ?</span>
    <span class="corner-mark right">maltsev · dev</span>

    <div class="site-wrapper">
        {% include "components/header.html" %}

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        {% include "components/footer.html" %}
    </div>

    <button class="theme-toggle" aria-label="Toggle theme" id="themeToggle">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="5"/>
            <g stroke-linecap="round">
                <line x1="12" y1="2" x2="12" y2="4"/>
                <line x1="12" y1="20" x2="12" y2="22"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="2" y1="12" x2="4" y2="12"/>
                <line x1="20" y1="12" x2="22" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </g>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/fade-in.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
